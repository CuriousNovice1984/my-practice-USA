{% load i18n %}
{# Shared copyable email card — used on /tools/boilerplate/ and inquiry detail. #}
{# Required: card_title, card_id, body                                          #}
{# Optional: subject — adds a copyable subject row                              #}
<section class="bp-card">
    <h2>{{ card_title }}</h2>
    <div id="{{ card_id }}">
        {% if subject %}
        <div class="bp-subject">
            <span class="bp-subject-label">{% trans "Subject" %}</span>
            <span class="bp-subject-text">{{ subject }}</span>
            <button type="button" class="btn btn-secondary bp-copy-btn"
                    data-copy="{{ subject }}"
                    x-data="{ copied: false }"
                    x-on:click="navigator.clipboard.writeText($el.dataset.copy).then(() => { copied = true; setTimeout(() => copied = false, 1800) })"
                    x-text="copied ? '{% trans "Copied" %}' : '{% trans "Copy" %}'">{% trans "Copy" %}</button>
        </div>
        {% endif %}
        <pre class="bp-text">{{ body }}</pre>
        <button type="button" class="btn btn-secondary bp-copy-btn"
                x-data="{ copied: false }"
                x-on:click="navigator.clipboard.writeText($el.previousElementSibling.textContent).then(() => { copied = true; setTimeout(() => copied = false, 1800) })"
                x-text="copied ? '{% trans "Copied" %}' : '{% trans "Copy" %}'">{% trans "Copy" %}</button>
    </div>
</section>
